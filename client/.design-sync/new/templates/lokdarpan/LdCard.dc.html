<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div class="bg-dark-900" style="height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:16px;border:1px solid rgba(255,255,255,.06);transition:transform .2s ease,border-color .2s ease" style-hover="transform:translateY(-4px);border-color:rgba(255,255,255,.2)"><a href="{{ link }}" aria-label="{{ label }}" style="position:relative;display:block;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:repeating-linear-gradient(135deg,#26262c 0 10px,#1f1f25 10px 20px)"><span style="position:absolute;left:8px;top:8px;font:11px ui-monospace,monospace;color:#8b8b95">artwork</span><sc-if value="{{ hasDur }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;right:8px;bottom:8px;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:600">{{ dur }}</span></sc-if><sc-if value="{{ hasProgress }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.2)"><svg width="100%" height="4" aria-hidden="true" style="display:block"><rect x="0" y="0" height="4" width="{{ progressW }}" fill="#3B82F6"></rect></svg></span></sc-if></a><div style="display:flex;flex-direction:column;gap:4px;padding:0 4px 4px"><a href="{{ link }}" style="color:#fff;text-decoration:none;font-weight:600;font-size:16px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em">{{ label }}</a><div style="display:flex;align-items:center;gap:8px;min-height:32px"><sc-if value="{{ isLive }}" hint-placeholder-val="{{ false }}"><span class="bg-primary-600" style="flex:none;padding:2px 6px;border-radius:4px;color:#fff;font-size:12px;font-weight:700;letter-spacing:.06em">LIVE</span></sc-if><span style="flex:1;min-width:0;color:#A1A1AA;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ meta }}</span><sc-if value="{{ notAdded }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ toggleAdd }}" aria-label="Add to My List" title="Add to My List" style="flex:none;width:44px;height:44px;margin:-6px -8px -6px 0;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:transparent;color:#A1A1AA;cursor:pointer;transition:background .15s ease,color .15s ease,transform .15s ease" style-hover="background:rgba(255,255,255,.1);color:#fff" style-active="transform:scale(.9)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button></sc-if><sc-if value="{{ added }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ toggleAdd }}" aria-label="Remove from My List" title="In My List" style="flex:none;width:44px;height:44px;margin:-6px -8px -6px 0;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;cursor:pointer" style-active="transform:scale(.9)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></button></sc-if></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { added: false };
  renderVals() {
    const p = Number(this.props.progress) || 0;
    const live = !!this.props.live;
    const toggleAdd = (e) => { e.preventDefault(); this.setState(s => ({ added: !s.added })); };
    return {
      link: this.props.href || './Watch.dc.html',
      isLive: live, hasDur: !!this.props.dur && !live,
      hasProgress: p > 0, progressW: p + '%',
      added: this.state.added, notAdded: !this.state.added, toggleAdd
    };
  }
}
</script>
</body>
</html>
