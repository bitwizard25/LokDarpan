<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}"><nav aria-label="Main" style="width:240px;height:calc(100vh - 64px);box-sizing:border-box;padding:16px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid rgba(255,255,255,.08)"><sc-for list="{{ items }}" as="it" hint-placeholder-count="6"><sc-if value="{{ it.on }}" hint-placeholder-val="{{ false }}"><a href="{{ it.href }}" aria-current="page" style="position:relative;height:48px;display:flex;align-items:center;gap:16px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.08);color:#fff;font-weight:600;font-size:16px;text-decoration:none"><span class="bg-primary-500" style="position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0"></span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="{{ it.d }}"></path></svg>{{ it.label }}</a></sc-if><sc-if value="{{ it.off }}" hint-placeholder-val="{{ true }}"><a href="{{ it.href }}" style="height:48px;display:flex;align-items:center;gap:16px;padding:0 12px;border-radius:12px;color:#A1A1AA;font-weight:500;font-size:16px;text-decoration:none;transition:background .15s ease,color .15s ease" style-hover="background:rgba(255,255,255,.05);color:#fff"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="{{ it.d }}"></path></svg>{{ it.label }}</a></sc-if></sc-for><div style="margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:16px;padding-left:12px"><a href="#" style="color:#A1A1AA;font-size:14px;text-decoration:none" style-hover="color:#fff">Settings</a><a href="#" style="color:#A1A1AA;font-size:14px;text-decoration:none" style-hover="color:#fff">Help</a><button type="button" onClick="{{ toggle }}" aria-label="Collapse sidebar to icons" title="Collapse" style="margin-left:auto;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:transparent;color:#D4D4D8;cursor:pointer;transition:background .15s ease,color .15s ease" style-hover="background:rgba(255,255,255,.08);color:#fff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button></div></nav></sc-if>
<sc-if value="{{ rail }}" hint-placeholder-val="{{ false }}"><nav aria-label="Main" style="width:72px;height:calc(100vh - 64px);box-sizing:border-box;padding:16px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid rgba(255,255,255,.08)"><sc-for list="{{ items }}" as="it" hint-placeholder-count="6"><sc-if value="{{ it.on }}" hint-placeholder-val="{{ false }}"><a href="{{ it.href }}" aria-current="page" aria-label="{{ it.label }}" title="{{ it.label }}" style="position:relative;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(255,255,255,.08);color:#fff"><span class="bg-primary-500" style="position:absolute;left:-12px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0"></span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="{{ it.d }}"></path></svg></a></sc-if><sc-if value="{{ it.off }}" hint-placeholder-val="{{ true }}"><a href="{{ it.href }}" aria-label="{{ it.label }}" title="{{ it.label }}" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:#A1A1AA;transition:background .15s ease,color .15s ease" style-hover="background:rgba(255,255,255,.05);color:#fff"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="{{ it.d }}"></path></svg></a></sc-if></sc-for><div style="margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)"><button type="button" onClick="{{ toggle }}" aria-label="Expand sidebar" title="Expand" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:transparent;color:#D4D4D8;cursor:pointer;transition:background .15s ease,color .15s ease" style-hover="background:rgba(255,255,255,.08);color:#fff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button></div></nav></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'Home';
    const items = [
      ['Home', './Lokdarpan.dc.html', 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'],
      ['Explore', './Search.dc.html', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM15.5 8.5l-2 5-5 2 2-5z'],
      ['Shorts', '#', 'M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM10 9l5 3-5 3z'],
      ['Following', '#', 'M9 11a4 4 0 1 0 0-8a4 4 0 0 0 0 8zM2 21v-1a6 6 0 0 1 12 0v1M16 3.5a4 4 0 0 1 0 7.5M22 21v-1a6 6 0 0 0-4-5.6'],
      ['Watch parties', './Lobby.dc.html', 'M3 5h18v12H3zM8 21h8M12 17v4'],
      ['Library', '#', 'M6 3h12v18l-6-4-6 4z']
    ].map(([label, href, d]) => ({ label, href, d, on: label === a, off: label !== a }));
    const c = !!this.props.collapsed;
    return { items, expanded: !c, rail: c, toggle: this.props.onToggle };
  }
}
</script>
</body>
</html>
