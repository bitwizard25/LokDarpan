# Backend on EC2: one container (API + BullMQ worker + Redis + ffmpeg).
# MongoDB is Atlas (MONGO_URI in .env.docker). The client is on Vercel.
#   cp .env.docker.example .env.docker   # fill in
#   docker compose up -d --build
services:
  backend:
    build: .
    env_file: .env.docker
    ports:
      - "5000:5000"
    volumes:
      - redis-data:/data/redis
    restart: unless-stopped

volumes:
  redis-data:
